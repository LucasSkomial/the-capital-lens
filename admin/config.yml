backend:
  name: github
  repo: LucasSkomial/the-capital-lens
  branch: main

site_url: https://the-capital-lens.netlify.app
display_url: https://the-capital-lens.netlify.app
logo_url: /assets/logo.svg

media_folder: assets/uploads
public_folder: /assets/uploads

publish_mode: simple

collections:
  - name: analysis
    label: Market Analysis
    label_singular: Market Analysis
    folder: content/posts
    create: true
    format: json
    extension: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} — {{title}}"
    sortable_fields: [date, title]
    view_filters:
      - label: Featured
        field: featured
        pattern: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Short Summary, name: deck, widget: text, hint: "Shown on the homepage and analysis archive." }
      - { label: Read Time, name: readTime, widget: string, default: "7 min read" }
      - { label: Feature on Homepage, name: featured, widget: boolean, default: true }
      - label: Tags
        name: tags
        widget: list
        default: ["Weekly Analysis"]
        field: { label: Tag, name: tag, widget: string }
      - label: Market Snapshot
        name: snapshot
        widget: list
        min: 1
        fields:
          - { label: Name, name: name, widget: string, hint: "Example: S&P 500" }
          - { label: Value, name: value, widget: string, hint: "Example: 7,718.60" }
          - { label: Change / Note, name: change, widget: string, hint: "Example: +0.1% wk" }
          - label: Direction
            name: tone
            widget: select
            options:
              - { label: Up / Positive, value: up }
              - { label: Down / Negative, value: down }
              - { label: Neutral, value: flat }
      - label: Quick Take
        name: quickTake
        widget: list
        field: { label: Takeaway, name: takeaway, widget: text }
      - label: Report Sections
        name: sections
        widget: list
        min: 1
        summary: "{{fields.heading}}"
        fields:
          - { label: Section Heading, name: heading, widget: string }
          - label: Paragraphs
            name: body
            widget: list
            min: 1
            field: { label: Paragraph, name: paragraph, widget: text }
          - { label: Optional Callout, name: callout, widget: text, required: false }
      - label: Sources
        name: sources
        widget: list
        required: false
        fields:
          - { label: Source Label, name: label, widget: string }
          - { label: URL, name: url, widget: string }

  - name: site_settings
    label: Site Settings
    files:
      - label: Branding & About
        name: branding
        file: content/site.json
        format: json
        fields:
          - { label: Site Name, name: name, widget: string }
          - { label: Short Name, name: shortName, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Main Tagline, name: tagline, widget: string }
          - { label: Homepage Intro, name: homeIntro, widget: text }
          - { label: About Heading, name: aboutTitle, widget: string }
          - label: About Paragraphs
            name: aboutParagraphs
            widget: list
            field: { label: Paragraph, name: paragraph, widget: text }
          - { label: Disclaimer, name: disclaimer, widget: text }
